[project]
name = "fieldshift-api"
version = "0.1.0"
description = "Decision-support API comparing crop rotation strategies against historical NASA climate data (NASA Space Apps 2026 - Field Shift)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldshift"]

# --- Tests -------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
markers = [
    "live: calls the real NASA POWER API (deselected by default; run with `-m live`)",
]

# --- Lint / format -----------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import order
    "N",       # naming
    "UP",      # modern syntax
    "B",       # likely bugs
    "C4",      # comprehensions
    "SIM",     # simplifications
    "PT",      # pytest style
    "RUF",     # ruff specific
    "TID",     # tidy imports (layer boundaries, see below)
    "DTZ",     # timezone-aware datetimes
    "S",       # security
]
ignore = [
    "E501",  # long French sentences; line length is handled by the formatter
    "RUF001", "RUF002", "RUF003",  # French typography (×, –, °, non-breaking spaces) is intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PT018", "RUF005"]  # compact assertions are fine in tests

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# The business core must stay free of frameworks and I/O (docs/architecture.md, section 3).
# The layer rule itself is enforced by tests/unit/test_architecture.py.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests".msg = "Use httpx, and only inside fieldshift.infrastructure."

# --- Types -------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
