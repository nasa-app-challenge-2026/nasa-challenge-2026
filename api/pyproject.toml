[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "field-shift-server"
version = "3.0.0"
description = "Field Shift: the rotation algorithm (field_shift v5.1) served with FastAPI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=2.0",
    "scipy>=1.13",
    "httpx>=0.27",
    # water_use (the water score) reads its data bases with requests.
    "requests>=2.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "jsonschema>=4.22",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["field_shift*", "water_use*"]

[tool.setuptools.package-data]
field_shift = ["**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "reseau: test qui interroge les vraies bases (internet), activé par WATER_USE_RESEAU=1",
]
filterwarnings = [
    "error::DeprecationWarning:field_shift.*",
    # Starlette's test client wants httpx2 from now on; the server itself only needs httpx.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# water_use is the water team's module, copied as is: its code is not reformatted here.
extend-exclude = ["tests/fixtures", "water_use", "tests/water_use"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# Typographic apostrophes and "×" are part of the French crop names on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's way to ask for a dependency is `Depends(...)` in the default of a parameter.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]
