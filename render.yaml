# Creates a paid service and disk. Review pricing in Render before applying.
services:
  - type: web
    name: fieldshift-api
    runtime: docker
    branch: main
    plan: standard
    region: virginia
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    disk:
      name: fieldshift-cache
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FIELD_SHIFT_CORS_ORIGINS
        sync: false
      - key: FIELD_SHIFT_WORKERS
        value: '0'
      - key: FIELD_SHIFT_CACHE_DIR
        value: /var/data/field-shift
      - key: WATER_USE_CACHE
        value: /var/data/water-use
      - key: ALGO_CACHE_DIR
        value: /var/data/yield
