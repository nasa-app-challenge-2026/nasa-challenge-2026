# Modèles de rotation à EXPLORER. Ce ne sont pas des recommandations validées : le moteur les
# soumet aux contraintes bloquantes puis les compare. Chaque justification ne s'appuie que sur
# des propriétés documentées des cultures (voir crops.yaml et sources.yaml).
templates:
  - id: oat_clover_timothy_4y
    name_fr: Avoine puis 3 ans de prairie fléole–trèfle rouge
    crop_ids: [oat, clover_timothy_hay, clover_timothy_hay, clover_timothy_hay]
    rationale_fr: >-
      Garde la logique actuelle (céréale puis foin) en précisant une prairie avec légumineuse et
      en allongeant la phase pérenne.
    source_ids: [quebec_forages]

  - id: barley_pea_oat_clover_5y
    name_fr: Orge, pois, avoine puis 2 ans de prairie fléole–trèfle rouge
    crop_ids: [barley, field_pea, oat, clover_timothy_hay, clover_timothy_hay]
    rationale_fr: >-
      Ajoute une légumineuse annuelle (pois sec) et une deuxième céréale avant deux ans de
      prairie avec légumineuse.
    source_ids: [quebec_forages, fao_conservation_agriculture]

  - id: wheat_pea_barley_clover_5y
    name_fr: Blé, pois, orge puis 2 ans de prairie fléole–trèfle rouge
    crop_ids: [spring_wheat, field_pea, barley, clover_timothy_hay, clover_timothy_hay]
    rationale_fr: >-
      Trois années de cultures récoltées en grain, dont une légumineuse, puis deux ans de prairie.
    source_ids: [fao_conservation_agriculture]

  - id: barley_oat_hay_4y
    name_fr: Orge, avoine puis 2 ans de foin
    crop_ids: [barley, oat, hay_mixed, hay_mixed]
    rationale_fr: Ajoute une deuxième céréale avant le foin habituel.
    source_ids: []

  - id: oat_alfalfa_4y
    name_fr: Avoine puis 3 ans de luzerne
    crop_ids: [oat, alfalfa_hay, alfalfa_hay, alfalfa_hay]
    rationale_fr: >-
      Remplace le foin par une luzernière, légumineuse qui fixe l'azote, au prix d'un besoin en
      eau indicatif élevé.
    source_ids: [quebec_forages, fao_irrigation_water_needs]

  - id: soybean_oat_hay_3y
    name_fr: Soya, avoine puis foin
    crop_ids: [soybean_early, oat, hay_mixed]
    rationale_fr: Introduit le soya, légumineuse annuelle vendue en grain.
    source_ids: []

  - id: corn_soybean_wheat_3y
    name_fr: Maïs-grain, soya, blé
    crop_ids: [grain_corn, soybean_early, spring_wheat]
    rationale_fr: Rotation de grandes cultures répandue dans les régions plus chaudes du Québec.
    source_ids: []
