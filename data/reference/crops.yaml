  - id: field_pea
    name_fr: Pois sec
    name_en: Field pea
    scientific_name: Pisum sativum
    category: annual
    botanical_families: [Fabaceae]
    fixes_nitrogen: true
    season_model: cool_season
    heat_requirement:
      unit: gdd_base0
