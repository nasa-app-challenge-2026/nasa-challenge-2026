# Catalogue des cultures et de leurs exigences climatiques DOCUMENTÉES.
#
# Règles :
# - une valeur sans source n'entre pas dans ce fichier ; une exigence inconnue reste absente ;
# - confidence: documented  -> valeur lue dans la source citée ;
#   confidence: provisional -> hypothèse de l'équipe, affichée comme telle, à valider ;
# - les cultures pérennes ligneuses (érablière, verger, sapinière) ne sont pas des étapes de
#   rotation (category: perennial_woody est refusé dans une rotation).
crops:
  - id: oat
    name_fr: Avoine
    name_en: Oat
    scientific_name: Avena sativa
    category: annual
    botanical_families: [Poaceae]
    fixes_nitrogen: false
    season_model: cool_season
    heat_requirement:
      unit: gdd_base0
      minimum: 1483
      maximum: 1738
      basis:
        source_ids: [msu_mt200103]
        confidence: documented
        note_fr: >-
          Maturité complète (stade 8.9), du semis, base 0 °C ; essais à Scott (Saskatchewan),
          1993-1997.
    frost_tolerance:
      damage_threshold_c: -6.0
      inclusive: false
      basis:
        source_ids: [manitoba_spring_frost]
        confidence: documented
        note_fr: >-
          Les céréales de printemps tolèrent jusqu'à -6 °C : le point de croissance reste sous le
          sol jusqu'au stade 5 feuilles.
    water_need:
      minimum_mm: 450
      maximum_mm: 650
      basis:
        source_ids: [fao_irrigation_water_needs]
        confidence: documented
        note_fr: Valeur indicative FAO pour orge, avoine et blé, toute la période de croissance.
    context_indicator_ids: [gdd_base0, growing_season_length_days]
    not_modelled_fr:
      - Verse, maladies et qualité du grain liées à l'humidité à la récolte.

