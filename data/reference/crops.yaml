    frost_tolerance:
      damage_threshold_c: -6.0
      inclusive: false
      basis:
        source_ids: [manitoba_spring_frost]
        confidence: provisional
        note_fr: >-
          La source décrit le pois comme rarement perdu au gel printanier (deux points de
          croissance), sans seuil chiffré. Le seuil des céréales (-6 °C) est repris par analogie.
    water_need:
      minimum_mm: 350
      maximum_mm: 500
      basis:
        source_ids: [fao_irrigation_water_needs]
        confidence: documented
        note_fr: Valeur indicative FAO pour le pois, toute la période de croissance.
    context_indicator_ids: [gdd_base0]
    not_modelled_fr:
      - Maladies racinaires et retour trop fréquent des légumineuses annuelles.

  - id: soybean_early
    name_fr: Soya (variétés les plus hâtives)
    name_en: Soybean (earliest maturity)
    scientific_name: Glycine max
    category: annual
    botanical_families: [Fabaceae]
    fixes_nitrogen: true
    season_model: warm_season
    heat_requirement:
      unit: crop_heat_units
      minimum: 2300
      maximum: 2550
      basis:
        source_ids: [guide_soya_2024, rgcq_soya_2021]
        confidence: documented
        note_fr: >-
          2 300 UTM : cultivars les plus hâtifs offerts au Québec ; 2 550 UTM : limite de la
          classe « hâtifs » du RGCQ. Vérifier la cote de la variété choisie.
    frost_tolerance:
      damage_threshold_c: -2.0
      inclusive: true
      basis:
        source_ids: [manitoba_spring_frost, bourgeois_2012]
        confidence: provisional
        note_fr: >-
          Le soya ne tolère -2,8 °C que quelques heures et seulement jusqu'au stade VC ; le seuil
          prudent de -2 °C (fin du cumul des UTM au Québec) est retenu par l'équipe.
    water_need:
      minimum_mm: 450
      maximum_mm: 700
      basis:
        source_ids: [fao_irrigation_water_needs]
        confidence: documented
        note_fr: Valeur indicative FAO pour le soya, toute la période de croissance.
    context_indicator_ids: [crop_heat_units, last_spring_frost_doy, first_fall_killing_frost_doy]
    not_modelled_fr:
      - Température du sol au semis et inoculation.

